<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFS Graph Traversal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Depth-First Search (DFS) Traversal</h1>
        
        <div class="graph-info">
            <h3>Graph Structure:</h3>
            <pre>
A ➔ B, C
B ➔ D
C ➔ E
            </pre>
        </div>

        <button id="run-btn">Run DFS from Node A</button>

        <div class="output-section">
            <h3>Traversal Output:</h3>
            <div id="output" class="output-box">Click the button to see the traversal path...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
